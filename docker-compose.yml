services:
  postgres:
    image: postgres:16-alpine
    container_name: edv-service-manager-db
    environment:
      POSTGRES_DB: edv_service_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - edv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edv_service_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  edv_postgres_data:
